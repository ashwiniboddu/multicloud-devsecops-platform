prometheus:
  prometheusSpec:
    retention: 15d

    scrapeInterval: 15s

    evaluationInterval: 15s

    externalUrl: /prometheus

    routePrefix: /prometheus

    resources:
      requests:
        cpu: 250m
        memory: 512Mi

      limits:
        cpu: 500m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 20Gi