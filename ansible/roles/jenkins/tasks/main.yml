---
# ============================================================
# 1. Ensure Jenkins is running
# ============================================================

- name: Ensure Jenkins is enabled and running
  ansible.builtin.service:
    name: "{{ jenkins_service_name }}"
    state: started
    enabled: true


# ============================================================
# 2. Ensure Jenkins has Docker access
# ============================================================

- name: Add Jenkins user to Docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify:
    - Restart Jenkins


# ============================================================
# 3. Wait for Jenkins
# ============================================================

- name: Wait for Jenkins to be available
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ jenkins_port }}"
    delay: 5
    timeout: 60


# ============================================================
# 4. Display installed tools
# ============================================================

- name: Check Java
  ansible.builtin.command:
    cmd: java -version
  register: java_version
  changed_when: false
  failed_when: false

- name: Check Docker
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false
  failed_when: false

- name: Check AWS CLI
  ansible.builtin.command:
    cmd: aws --version
  register: aws_version
  changed_when: false
  failed_when: false

- name: Check Ansible
  ansible.builtin.command:
    cmd: ansible --version
  register: ansible_version
  changed_when: false
  failed_when: false

- name: Check kubectl
  ansible.builtin.command:
    cmd: kubectl version --client
  register: kubectl_version
  changed_when: false
  failed_when: false

- name: Check Helm
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_version_output
  changed_when: false
  failed_when: false

- name: Check Trivy
  ansible.builtin.command:
    cmd: trivy --version
  register: trivy_version_output
  changed_when: false
  failed_when: false


# ============================================================
# 5. Display tool verification
# ============================================================

- name: Display tool versions
  ansible.builtin.debug:
    msg:
      - "Java: {{ java_version.stderr | default('Unknown') }}"
      - "Docker: {{ docker_version.stdout | default('Unknown') }}"
      - "AWS CLI: {{ aws_version.stdout | default('Unknown') }}"
      - "Ansible: {{ ansible_version.stdout | default('Unknown') }}"
      - "kubectl: {{ kubectl_version.stdout | default('Unknown') }}"
      - "Helm: {{ helm_version_output.stdout | default('Unknown') }}"
      - "Trivy: {{ trivy_version_output.stdout | default('Unknown') }}"