{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: {{ include "multicloud-devsecops.fullname" . }}

  labels:

    {{- include "multicloud-devsecops.labels" . | nindent 4 }}

  annotations:

    {{- toYaml .Values.ingress.annotations | nindent 4 }}

spec:

  ingressClassName: {{ .Values.ingress.className }}

  rules:

    {{- range .Values.ingress.hosts }}

    - host: {{ .host | quote }}

      http:

        paths:

          {{- range .paths }}

          - path: {{ .path }}

            pathType: {{ .pathType }}

            backend:

              service:

                name: {{ include "multicloud-devsecops.fullname" $ }}

                port:

                  number: {{ $.Values.service.port }}

          {{- end }}

    {{- end }}

{{- end }}