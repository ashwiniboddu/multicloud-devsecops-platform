{{- if .Values.hpa.enabled }}

apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: {{ include "multicloud-devsecops.fullname" . }}

  labels:

    {{- include "multicloud-devsecops.labels" . | nindent 4 }}

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: {{ include "multicloud-devsecops.fullname" . }}

  minReplicas: {{ .Values.hpa.minReplicas }}

  maxReplicas: {{ .Values.hpa.maxReplicas }}

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: {{ .Values.hpa.cpuUtilization }}

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization

          averageUtilization: {{ .Values.hpa.memoryUtilization }}

{{- end }}