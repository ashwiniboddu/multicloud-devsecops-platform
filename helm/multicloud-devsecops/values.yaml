replicaCount: 2

image:
  repository: "YOUR_ECR_REPOSITORY"
  pullPolicy: Always
  tag: "latest"

nameOverride: ""

fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

config:
  springProfilesActive: "prod"
  serverPort: "8080"

secret:
  databaseUsername: "admin"
  databasePassword: "change-me"

resources:

  requests:
    cpu: "250m"
    memory: "256Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"

probes:

  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10

  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 20

ingress:

  enabled: true

  className: alb

  annotations:

    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

  hosts:

    - host: ""

      paths:

        - path: /

          pathType: Prefix

hpa:

  enabled: true

  minReplicas: 2

  maxReplicas: 5

  cpuUtilization: 70

  memoryUtilization: 80