replicaCount: 2

image:
  repository: us-east1-docker.pkg.dev/playground-s-11-8111faea/multicloud-devsecops-dev-app/demo-workshop
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

configMap:
  name: application-config

secret:
  name: application-secret

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

secretData:
  DATABASE_USERNAME: "admin"
  DATABASE_PASSWORD: "change-me"

ingress:
  enabled: true
  className: gce
  path: /
  pathType: Prefix
  annotations:
    alb.ingress.kubernetes.io/scheme: null
    alb.ingress.kubernetes.io/target-type: null
    alb.ingress.kubernetes.io/listen-ports: null
    kubernetes.io/ingress.class: gce

gcpIngress:
  enabled: true