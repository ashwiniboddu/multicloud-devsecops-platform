replicaCount: 2

image:
  repository: us-east1-docker.pkg.dev/playground-s-11-d5385d3b/multicloud-devsecops-dev-app/demo-workshop
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "250m"
    memory: "256Mi"

configMap:
  name: application-config

secret:
  name: application-secret

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

secretData:
  DATABASE_USERNAME: "admin"
  DATABASE_PASSWORD: "change-me"

# Disable AWS ingress
ingress:
  enabled: false

# Enable GCP ingress when needed later
gcpIngress:
  enabled: false