replicaCount: 2

image:
  repository: YOUR_ECR_REPOSITORY_URL
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"

configMap:
  name: application-config

secret:
  name: application-secret

ingress:
  enabled: true

  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

  host: ""

  path: /
  pathType: Prefix

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

secretData:
  DATABASE_USERNAME: "admin"
  DATABASE_PASSWORD: "change-me"