{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "application.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "application.labels" . | nindent 4 }}
    project: multicloud-devsecops

  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}

            backend:
              service:
                name: {{ .Values.ingress.serviceName | default "application-service" }}

                port:
                  number: {{ .Values.ingress.servicePort | default .Values.service.port }}

{{- end }}{{- if .Values.ingress.enabled }}

