# ============================================================
# SonarQube Configuration
# ============================================================

replicaCount: 1


# ============================================================
# Service Configuration
# ============================================================

service:
  type: ClusterIP
  port: 9000


# ============================================================
# Persistence
# ============================================================

persistence:
  enabled: true

  storageClass: ""

  accessMode: ReadWriteOnce

  size: 10Gi


# ============================================================
# Resources
# ============================================================

resources:

  requests:
    cpu: 500m
    memory: 2Gi

  limits:
    cpu: 1
    memory: 4Gi


# ============================================================
# PostgreSQL
# ============================================================

postgresql:

  enabled: true

  auth:

    username: sonar

    password: sonar-password

    database: sonarqube

  primary:

    persistence:

      enabled: true

      size: 10Gi